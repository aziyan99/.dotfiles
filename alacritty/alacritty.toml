[font]
size = 12.0

[font.normal]
family = "Iosevka Term Nerd Font"
style = "Regular"

[font.bold]
family = "Iosevka Term Nerd Font"
style = "Bold"

[font.italic]
family = "Iosevka Term Nerd Font"
style = "Italic"

[font.bold_italic]
family = "Iosevka Term Nerd Font"
style = "Bold Italic"

[[keyboard.bindings]]
key="F11"
action="ToggleFullscreen"

# [window]
# startup_mode="Fullscreen"
